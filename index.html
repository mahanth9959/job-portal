<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hireline is a calm, colorful hiring workspace for recruiters and candidates — roles, companies, applications and reports in one clear line."
    />
    <meta name="theme-color" content="#FBF7F8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hireline — Hiring, in clear view</title>
    <script>
      try {
        if (localStorage.getItem('hireline.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch {
        /* A browser with storage blocked still gets the light theme. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
